<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>哲人小鎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: map-first stage. The painted town fills the left; a ledger (resident card, dialogues, residents) runs down the right. */
:root{
  --bg:#e7eae3; --surface:#f8f9f5; --surface-2:#eef1ea; --ink:#1b2320; --muted:#59645e; --line:#cdd5cb;
  --accent:#2b5c8c; --gold:#8f6a1c;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-latin:"Marcellus","Times New Roman",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --surface:#161c19; --surface-2:#1d2521; --ink:#e5eae6; --muted:#97a39d; --line:#2a3430;
    --accent:#8bb8e4; --gold:#d9b25e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161c19; --surface-2:#1d2521; --ink:#e5eae6; --muted:#97a39d; --line:#2a3430;
  --accent:#8bb8e4; --gold:#d9b25e; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
*{box-sizing:border-box}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding-inline:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.12em;margin:0;line-height:1.1}
.brand .latin{display:block;font-family:var(--f-latin);font-size:12.5px;letter-spacing:.34em;color:var(--muted);margin-top:3px}
.clock{display:flex;align-items:baseline;gap:10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.clock #cTime{font-size:30px;letter-spacing:.02em}
.clock .sub{font-family:var(--f-body);color:var(--muted);font-size:15px}
.controls{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;font-family:var(--f-mono);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.livebtn{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:6px 16px;font-size:15px}
.livebtn[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
.livebtn:disabled{opacity:.55;cursor:not-allowed}
.motto{padding-block:8px;font-family:var(--f-display);font-size:17px;color:var(--ink);border-bottom:1px solid var(--line)}
.motto small{font-family:var(--f-body);color:var(--muted);font-size:14px;margin-right:10px;letter-spacing:.08em}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;min-height:0;padding-block:12px}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide .panel{display:none}
.mapwrap{position:relative;min-width:0;min-height:0;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 14px 34px -22px rgba(0,0,0,.55);background:#7d8a6c}
#map{display:block;position:relative;z-index:1;touch-action:none;cursor:grab}
#map3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapctl,.maphint,.actbtn,.talk,.note3d{z-index:2}
.note3d{position:absolute;left:12px;top:12px;margin:0;max-width:min(420px,calc(100% - 100px));padding:8px 12px;border-radius:10px;background:rgba(20,24,22,.82);color:#f5f3ea;font-size:13.5px;line-height:1.5}
.note3d button{margin-left:6px;border:0;border-radius:6px;padding:2px 8px;background:#f4c84a;color:#1b1a14;font-weight:700}
.mapctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{min-width:48px;height:42px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:700;box-shadow:0 4px 12px -6px rgba(0,0,0,.45)}
.mapctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.maphint{position:absolute;left:12px;bottom:12px;margin:0;padding:6px 12px;border-radius:999px;background:rgba(20,24,22,.75);color:#f5f3ea;font-size:14px;pointer-events:none;max-width:calc(100% - 100px)}
.actbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);border:0;border-radius:999px;background:var(--gold);color:#1b1a14;font-weight:700;font-size:16px;padding:10px 20px;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.actbtn:disabled{background:var(--surface);color:var(--muted);cursor:default}
.talk{position:absolute;left:12px;bottom:12px;width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);border:1px solid var(--line)}
.talk-head{display:flex;align-items:center;gap:10px}
.talk-head canvas{width:48px;height:48px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);flex:none}
.talk-head div{min-width:0;flex:1;display:flex;flex-direction:column}
.talk-head strong{font-family:var(--f-display);font-size:19px}
.talk-head span{color:var(--muted);font-size:14px}
.talk .chat h3{display:none}
.talk .chat .msgs{max-height:220px;margin-top:10px}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow .visitbtn{margin-top:0}
.visitbtn.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.visitbtn{margin-top:14px;width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--surface);padding:12px 14px;font-weight:700;font-size:16px}
.visit{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.visit-box{background:var(--surface);color:var(--ink);border-radius:14px;width:min(1320px,100%);max-height:100%;overflow:auto;padding:18px 20px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.visit-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.visit-head > div{min-width:0}
.eyebrow{margin:0;font-size:14px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.visit-head h2{font-family:var(--f-display);font-size:30px;margin:2px 0 4px;line-height:1.25;text-wrap:balance}
.visit-sub{margin:0;color:var(--muted)}
.visit-head .primary{flex:none;font-size:16px}
.visit-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}
.room-col{min-width:0}
.roomframe{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#1e1a16}
#roomCv3{position:absolute;inset:0;width:100%;height:100%;display:block}
#roomCv{position:relative;z-index:1}
#roomCv{display:block}
.itemlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.itemlist span{color:var(--muted);font-size:15px;margin-right:4px}
.itemlist button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:15px}
.itemcard{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.itemcard h4{margin:0 0 4px;font-family:var(--f-display);font-size:19px}
.itemcard p{margin:0}
.visit-side{min-width:0}
.visit-status{margin:0 0 6px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:15.5px}
.visit-side .chat h3{margin-top:10px}
.panel{min-height:0;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.intro h2{font-family:var(--f-display);font-size:22px;margin:0 0 6px;text-wrap:balance}
.intro p{margin:0 0 8px;color:var(--muted)}
.intro ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.who{display:flex;gap:12px;align-items:center}
.portrait{width:64px;height:64px;border-radius:50%;background:var(--surface-2);flex:none;border:1px solid var(--line)}
.who h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.2}
.who .en{font-family:var(--f-latin);font-size:15px;color:var(--muted);margin-left:6px;font-weight:400}
.who .meta{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.who .x{margin-left:auto;align-self:flex-start;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
.card blockquote{margin:12px 0;padding:0 0 0 12px;border-left:2px solid var(--gold);font-family:var(--f-display);font-size:18px}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:16px}
.now dt{color:var(--muted);font-size:14px;letter-spacing:.08em;padding-top:1px}
.now dd{margin:0;min-width:0}
.card h3{font-family:var(--f-display);font-size:18px;margin:16px 0 6px;letter-spacing:.04em}
.why{margin:0;color:var(--muted);font-size:16px}
.sched{list-style:none;margin:0;padding:0;font-size:15px}
.sched li{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:3px 6px;border-radius:5px}
.sched time{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sched li.on{background:var(--surface-2);font-weight:500}
.sched li.on time{color:var(--accent)}

.chat .msgs{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;margin-bottom:8px}
.msgs:empty{display:none}
.msg{padding:8px 11px;border-radius:10px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--surface)}
.msg.him{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display)}
.msg .tag{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:14.5px}
.chatform{display:flex;gap:8px;align-items:flex-end}
.chatform textarea{flex:1;min-width:0;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;min-height:42px}
.chatform button,.primary{border:0;border-radius:8px;background:var(--ink);color:var(--bg);padding:9px 14px;font-weight:500}
.chatform button:disabled{opacity:.5;cursor:wait}
.hint{margin:6px 0 0;font-size:14px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:9px 14px;font-size:16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.empty{color:var(--muted);font-size:15px;padding:10px 2px;margin:0}

.log{display:flex;flex-direction:column;gap:10px}
.deb{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.deb summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.deb summary::-webkit-details-marker{display:none}
.pair{font-weight:700;font-family:var(--f-display);font-size:18px}
.pair .vs{color:var(--muted);font-weight:400;margin-inline:4px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.25);margin-right:5px;vertical-align:1px}
.chip{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.chip.live{border-color:var(--gold);color:var(--gold)}
.state{font-size:13.5px;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.deb.done .state{display:none}
.where{width:100%;font-size:14px;color:var(--muted);font-family:var(--f-mono)}
.lines{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.lines:empty{display:none}
.ln{margin:0;font-size:16px;display:grid;grid-template-columns:auto 1fr;gap:8px}
.ln b{font-weight:700;white-space:nowrap;font-size:15px;padding-top:1px}
.ln span{min-width:0;font-family:var(--f-display)}
@keyframes pulse{50%{opacity:.25}}

.arrange{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.arrange label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.arrange select{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 8px;min-width:0}
.arrange .full{grid-column:1/-1}
.people{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.people button{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 4px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline}
.people button:hover{background:var(--surface-2)}
.people .nm{font-weight:700;font-family:var(--f-display)}
.people .st{grid-column:2;color:var(--muted);font-size:14.5px;min-width:0}

.joinbox{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.66);display:flex;align-items:center;justify-content:center;padding:16px}
.joincard{background:var(--surface);color:var(--ink);border-radius:14px;padding:22px 24px;width:min(440px,100%);box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.joincard h2{font-family:var(--f-display);font-size:26px;margin:0 0 6px}
.joincard p{margin:0 0 12px;color:var(--muted)}
.joincard input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;font-size:17px;margin-bottom:12px}
.joincard .btns{display:flex;flex-direction:column;gap:8px}
.joincard .btns button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:16px;background:var(--surface-2);color:var(--ink)}
.joincard .btns button.go{background:var(--accent);color:var(--surface)}
.netrow{display:flex;gap:8px;margin:8px 0}
.netrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:14px}
.netrow button,.netbtn{border:0;border-radius:8px;background:var(--ink);color:var(--bg);padding:8px 12px;font-weight:600}
#netPlayers{list-style:none;margin:6px 0 10px;padding:0}
#netPlayers li{padding:4px 0;border-top:1px solid var(--line)}
#netChat{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:6px 0}
@media (max-width:860px){
  .app{height:auto}
  .stage{grid-template-columns:minmax(0,1fr)}
  .mapwrap{height:70vh;min-height:380px}
  .visit-body{grid-template-columns:minmax(0,1fr)}
  .visit{padding:8px}
  .visit-head h2{font-size:24px}
  .panel{overflow:visible}
  .controls{margin-left:0}
}
@media (prefers-reduced-motion: reduce){ .state::before{animation:none} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><h1>哲人小鎮</h1><span class="latin">POLIS · PHILOSOPHORUM</span></div>
    <div class="clock"><span class="sub" id="cDay">第 1 天</span><span id="cTime">09:40</span><span class="sub" id="cPhase">上午</span><span class="sub" id="cWind"></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="時間速度">
        <button id="sp0" data-s="0" aria-pressed="false">暫停</button>
        <button id="sp1" data-s="1" aria-pressed="true">1×</button>
        <button id="sp2" data-s="2" aria-pressed="false">2×</button>
        <button id="sp4" data-s="4" aria-pressed="false">4×</button>
      </div>
      <button class="livebtn" id="liveBtn" aria-pressed="false">Claude 即興思辨：關</button>
    </div>
  </header>
  <div class="motto" id="motto" hidden></div>
  <main class="stage">
    <div class="mapwrap" id="mapwrap"><canvas id="map3d" hidden aria-hidden="true"></canvas><canvas id="map" aria-label="哲人小鎮地圖：拖曳移動、滾輪縮放，點擊哲學家或房子查看介紹，雙擊房子進門拜訪"></canvas>
      <div class="mapctl" role="group" aria-label="地圖控制"><button type="button" id="viewBtn" aria-pressed="false">2D 地圖</button><button type="button" id="zIn" aria-label="放大地圖">＋</button><button type="button" id="zOut" aria-label="縮小地圖">－</button><button type="button" id="zFit">全景</button><button type="button" id="sideBtn" aria-pressed="false">隱藏側欄</button></div>
      <p class="note3d" id="note3d" hidden></p>
      <p class="maphint" id="mapHint">方向鍵／WASD 走路 · 點地圖移動 · 點擊人物就會走過去聊天，走到門口就會進門 · 滾輪縮放</p>
      <button class="actbtn" id="actBtn" type="button" hidden></button>
      <div class="talk" id="talk" hidden>
        <div class="talk-head"><canvas id="talkPortrait" width="96" height="96"></canvas><div><strong id="talkName"></strong><span id="talkWhere"></span></div><button class="primary" id="talkEnd" type="button">結束對話</button></div>
        <div id="talkChat"></div>
      </div>
    </div>
    <aside class="panel">
      <section class="card" id="detail"></section>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tabLog" aria-selected="true">思辨紀錄 <span id="logCount">0</span></button>
        <button role="tab" id="tabPeople" aria-selected="false">居民</button>
        <button role="tab" id="tabNet" aria-selected="false" hidden>連線</button>
      </nav>
      <section id="paneLog">
        <p class="empty" id="logEmpty">還沒有人碰面。哲學家出門後在路上、廣場或咖啡館相遇，就會停下來思辨人生。</p>
        <div class="log" id="log"></div>
      </section>
      <section id="paneNet" hidden>
        <p class="hint" id="netStatus">尚未連線</p>
        <button class="netbtn" id="netHostBtn" type="button" hidden>建立小鎮並邀請朋友</button>
        <div id="netShare" hidden><div class="netrow"><input id="netLink" readonly aria-label="邀請連結"><button type="button" id="netCopy">複製</button></div><p class="hint">把這個連結傳給朋友，他用瀏覽器打開、取好名字就能進來。你的這個分頁要保持開著。</p></div>
        <h3>在鎮上的玩家</h3><ul id="netPlayers"></ul>
        <h3>玩家聊天</h3><div id="netChat"></div>
        <form class="netrow" id="netChatForm"><input id="netChatInput" maxlength="200" placeholder="對大家說點什麼…" aria-label="玩家聊天"><button type="submit">送出</button></form>
      </section>
      <section id="panePeople" hidden>
        <form class="arrange" id="arrange">
          <label>哲學家甲<select id="arA"></select></label>
          <label>哲學家乙<select id="arB"></select></label>
          <label class="full">主題<select id="arT"></select></label>
          <button class="primary full" type="submit">請兩人到廣場思辨</button>
          <p class="hint full" id="arMsg"></p>
        </form>
        <ul class="people" id="people"></ul>
      </section>
    </aside>
  </main>
</div>

<div class="joinbox" id="joinBox" hidden>
  <div class="joincard" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
    <h2 id="joinTitle">歡迎來到哲人小鎮</h2>
    <p>先替自己取個名字，其他玩家會看到它。</p>
    <input id="joinName" maxlength="16" placeholder="你的名字" aria-label="你的名字">
    <div class="btns">
      <button class="go" id="joinAsGuest" type="button" hidden>加入<span id="joinHostName"></span>的小鎮</button>
      <button id="joinAsHost" type="button">建立小鎮並邀請朋友</button>

const SPEED=22; // world px per game minute

function currentEntry(p){
  if(p.host){return {L:p.homeLoc,mode:'in',act:'在家接待訪客',key:'host'};}
  if(p.summon){return {L:LOC.agora,mode:'out',act:`應邀到廣場和${byId[p.summon.partner].zh}思辨`,key:'summon'};}
  const h=hour();let idx=0;for(let i=0;i<p.sched.length;i++)if(p.sched[i][0]<=h)idx=i;
  const e=p.sched[idx];return {L:resolveLoc(p,e[1]),mode:e[2],act:e[3],key:idx};
}
function sleeping(p){return p.inside&&p.act.includes('睡');}
function clampArea(A,v,ax){if(A.type==='rect')return ax==='x'?clamp(v,A.x0,A.x1):clamp(v,A.y0,A.y1);if(A.type==='circle')return ax==='x'?clamp(v,A.x-A.r,A.x+A.r):clamp(v,A.y-A.r,A.y+A.r);return v;}
function pickTarget(p,L){
  const A=L.area;
  if(p.summon&&L===LOC.agora){return {x:800+(p.id<p.summon.partner?-11:11)+rand(-2,2),y:470+rand(-3,3)};}
  if(A.type==='loop'||A.type==='boulder'){p.loopI=0;const pt=(A.seq||A.pts)[0];return {x:pt[0],y:pt[1]};}
  if(L.public&&Math.random()<0.45){
    const others=P.filter(o=>o!==p&&o.L===L&&o.arrived&&!o.inside&&!o.debate&&o.cool<=0);
    if(others.length){const o=pick(others);return {x:clampArea(A,o.x+rand(-14,14),'x'),y:clampArea(A,o.y+rand(-10,10),'y')};}
  }
  if(A.type==='circle'){const a=rand(0,TAU),r=Math.sqrt(Math.random())*A.r;return {x:A.x+Math.cos(a)*r,y:A.y+Math.sin(a)*r*0.8};}

}
function plan(p){
  const e=currentEntry(p);p.act=e.act;p.mode=e.mode;const L=e.L;
  if(Math.random()<0.6)p.thought=pick(p.thoughts);
  if(p.inside){if(L===p.L&&e.mode==='in')return;p.inside=false;p.arrived=false;}
  if(L===p.L&&p.arrived){
    if(e.mode==='in'){p.path=[{x:L.door[0],y:L.door[1]}];p.after='inside';p.arrived=false;}
    else if(p.summon){p.path=[pickTarget(p,L)];p.wait=30;}
    return;
  }
  p.L=L;p.arrived=false;
  const starts=[...new Set([p.lastNode,p.nextNode].filter(Boolean))];
  let best=null;
  for(const s of starts){const r=route(s,L.node);const tot=Math.hypot(N[s][0]-p.x,N[s][1]-p.y)+r.len;if(!best||tot<best.tot)best={tot,path:r.path};}
  const pts=best.path.map(id=>({x:N[id][0],y:N[id][1],node:id}));
  if(e.mode==='in'){pts.push({x:L.door[0],y:L.door[1]});p.after='inside';}
  else{pts.push(pickTarget(p,L));p.after='area';}
  p.path=pts;p.nextNode=null;
}
function placeInitial(p){
  const e=currentEntry(p);p.ekey=e.key;p.act=e.act;p.mode=e.mode;p.L=e.L;p.lastNode=e.L.node;p.path=[];p.cool=0;p.face=1;p.thought=pick(p.thoughts);p.thoughtAt=gameMin;
  if(e.mode==='in'){p.inside=true;p.x=e.L.door[0];p.y=e.L.door[1];p.arrived=false;}
  else{p.inside=false;const t=pickTarget(p,e.L);p.x=t.x;p.y=t.y;p.arrived=true;p.wait=rand(2,20);}
}
function step(p,dm){
  let d=SPEED*dm;
  while(d>0&&p.path.length){
    const t=p.path[0],dx=t.x-p.x,dy=t.y-p.y,len=Math.hypot(dx,dy);
    if(Math.abs(dx)>0.4)p.face=dx>0?1:-1;
    if(len<=d){p.x=t.x;p.y=t.y;d-=len;if(t.node)p.lastNode=t.node;p.path.shift();}
    else{p.x+=dx/len*d;p.y+=dy/len*d;d=0;}
  }
}
function onArrive(p){
  if(p.after==='inside'){p.inside=true;p.after=null;return;}
  if(p.after==='area'){p.after=null;p.arrived=true;p.lastNode=p.L.node;p.wait=rand(4,22);}
}
function areaTick(p,dm){
  const A=p.L.area;
  if(A.type==='loop'||A.type==='boulder'){
    const seq=A.seq||A.pts;p.loopI=((p.loopI||0)+1)%seq.length;const pt=seq[p.loopI];p.path=[{x:pt[0],y:pt[1]}];return;
  }
  p.wait-=dm;if(p.wait<=0){p.path=[pickTarget(p,p.L)];p.wait=rand(8,32);}

/* ---------- debates ---------- */
const debates=[];const pairCool={};let dseq=0;
const pairKey=(a,b)=>[a.id,b.id].sort().join('|');
function placeName(a,b){if(a.arrived&&a.L)return a.L.name;if(b.arrived&&b.L)return b.L.name;return '小鎮的路上';}
function scriptLines(a,b,th){
  return [
    {who:a,text:pick(OPENERS[th]).replace('{b}',b.zh)},
    {who:b,text:b.themes[th][0]},
    {who:a,text:pick(a.retorts)+a.themes[th][0]},
    {who:b,text:pick(b.retorts)+b.themes[th][1]},
    {who:a,text:a.themes[th][1]},
    {who:b,text:pick(b.farewells)}
  ];
}
function checkMeetings(){
  const vis=P.filter(p=>!p.inside&&!p.debate&&!p.talking);
  for(let i=0;i<vis.length;i++)for(let j=i+1;j<vis.length;j++){
    const a=vis[i],b=vis[j];if(a.debate||b.debate)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)>30)continue;
    const summoned=a.summon&&b.summon&&a.summon.partner===b.id&&b.summon.partner===a.id;
    if(!summoned){if(a.cool>0||b.cool>0)continue;if((pairCool[pairKey(a,b)]||-1)>gameMin)continue;}
    startDebate(a,b,summoned?a.summon.theme:null,!!summoned);
  }
}
function startDebate(a,b,theme,summoned){
  const key=pairKey(a,b);
  if(!theme){const opts=Object.keys(THEMES).filter(t=>t!==pairCool['t'+key]);theme=pick(opts);}
  pairCool['t'+key]=theme;
  const d={id:++dseq,a,b,theme,place:placeName(a,b),time:clockStr(),lines:[],idx:-1,t:0,next:0,status:'talking',live:false,summoned};
  for(const p of [a,b]){const nn=p.path.find(q=>q.node);p.nextNode=nn?nn.node:null;p.path=[];p.debate=d;}
  a.face=b.x>=a.x?1:-1;b.face=-a.face;
  if(Math.abs(a.x-b.x)<14){const mx=(a.x+b.x)/2;a.x=mx-a.face*8;b.x=mx+a.face*8;}
  debates.push(d);mountDebate(d);
  if(liveOn&&sampleApi&&!liveBusy&&performance.now()>liveCoolUntil){d.status='loading';d.live=true;runLiveDebate(d);}
  else d.lines=scriptLines(a,b,theme);
  refreshDebateHead(d);
}
function endDebate(d){
  d.status='done';
  const {a,b}=d;
  for(const p of [a,b]){p.debate=null;p.cool=60;p.ekey=null;if(d.summoned)p.summon=null;}
  pairCool[pairKey(a,b)]=gameMin+8*60;
  debates.splice(debates.indexOf(d),1);
  d.el.classList.add('done');refreshDebateHead(d);hostDebateMsg(d,'end');
  const all=[...logEl.querySelectorAll('details.deb.done')];all.slice(3).forEach(el=>el.open=false);
}
function lineDur(t){return 1700+[...t].length*85;}
function tickDebates(dtReal){
  const rate=speed===0?0:Math.min(speed,2);
  for(const d of [...debates]){
    if(d.status!=='talking')continue;
    d.t+=dtReal*rate;
    if(d.t>=d.next){d.idx++;if(d.idx>=d.lines.length){endDebate(d);continue;}
      const l=d.lines[d.idx];d.next=d.t+lineDur(l.text);appendLine(d,l);}
  }
}

async function runLiveDebate(d){

現在是${d.time}，地點：${d.place}。
${personaBlock(a)}
${personaBlock(b)}
${a.zh}剛才正在「${a.act}」，${b.zh}正在「${b.act}」。兩人偶然相遇，開始思辨「${THEMES[d.theme]}」。

- 忠於兩人真實的哲學立場與說話風格，可以化用他們真正的觀點；不要捏造書名或引文出處。
- 可以利用跨時代相遇的趣味（例如提到對方的時代、作品或生活習慣）。
- 要有真正的交鋒，最後一句做收束（保留分歧或部分同意皆可）。
只輸出 JSON：{"lines":[{"who":"A","text":"..."},{"who":"B","text":"..."}]}，A 代表${a.zh}，B 代表${b.zh}。`;
  try{

let _trees=null;
function treeSpots(){
  if(_trees)return _trees;
  const roadEdges=EDGES.filter(isRoadEdge);
  const spurs=P.filter(p=>p.id!=='sartre').map(p=>[N[p.house.node],p.house.door]);
  const zones=P.map(p=>p.house.box).concat([[440,662,200,140],[950,350,180,170],[1050,90,210,200],[150,380,260,200],[1150,550,200,170],[760,850,540,80]]);
  const tr=rng(5),out=[];let placed=0;
  for(let i=0;i<1900&&placed<310;i++){
    const x=20+tr()*(W-40),y=30+tr()*(H-50);
    if(Math.hypot(x-800,y-470)<140||Math.hypot(x-700,y-1450)<115)continue;
    if(((x-LAKE[0])/(LAKE[2]+18))**2+((y-LAKE[1])/(LAKE[3]+18))**2<1)continue;
    if(zones.some(z=>x>z[0]-12&&x<z[0]+z[2]+12&&y>z[1]-6&&y<z[1]+z[3]+22))continue;
    if(inPoly(x,y,SAND)||inPoly(x,y,SEA))continue;
    if(riverDist(x,y)<24)continue;
    if(roadEdges.some(([a,b])=>segDist(x,y,...N[a],...N[b])<20))continue;
    if(spurs.some(([a,b])=>segDist(x,y,a[0],a[1],b[0],b[1])<14))continue;
    if(LOC.trail.area.pts.some((p,j,arr)=>{const q=arr[(j+1)%arr.length];return segDist(x,y,p[0],p[1],q[0],q[1])<14;}))continue;
    placed++;
    if(inPoly(x,y,MOUNTAIN)){if(y>60)out.push({x,y,k:'pine',s:1});continue;}
    if(x<640){if(tr()<.3)out.push({x,y,k:'cypress',s:1});else out.push({x,y,k:'olive',s:.9+tr()*.4});}else out.push({x,y,k:'leafy',s:.8+tr()*.4});
  }
  return _trees=out;
}

function wrapText(c,text,maxW){

/* ---------- main loop ---------- */
let last=performance.now();
function update(dm,dtReal){
  if(NET.role==='guest'){guestUpdate(dtReal);return;}
  for(const p of P){
    if(p.summon&&gameMin>p.summon.until)p.summon=null;
    if(p.cool>0)p.cool-=dm;
    if(p.debate||p.talking)continue;
    const e=currentEntry(p);
    if(e.key!==p.ekey){p.ekey=e.key;plan(p);}
    if(gameMin-p.thoughtAt>40){p.thought=pick(p.thoughts);p.thoughtAt=gameMin;}
    if(p.inside)continue;
    if(p.path.length){step(p,dm);if(!p.path.length)onArrive(p);}
    else if(p.arrived)areaTick(p,dm);
  }
  checkMeetings();tickDebates(dtReal);
  const tnow=performance.now();
  if(speed>0&&tnow>ambNext){const cands=P.filter(p=>!p.inside&&!p.debate&&!p.talking&&p.id!==selected);if(cands.length){const p=pick(cands);amb={p,text:pick(p.thoughts),until:tnow+4800};}ambNext=tnow+9000;}
}
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  const dm=dt/1000*BASE*speed;if(NET.role!=='guest')gameMin+=dm;netTickOthers(dt);
  tickNature(dt);tickSea(dt);tickWind(dt);moveMe(dt);greetNearby();updateAct();
  if(follow&&!camTarget){cam.x+=(me.x-cam.x)*.1;cam.y+=(me.y-cam.y)*.1;clampCam();}
  if(camTarget){cam.x+=(camTarget.x-cam.x)*.12;cam.y+=(camTarget.y-cam.y)*.12;clampCam();if(Math.hypot(camTarget.x-cam.x,camTarget.y-cam.y)<1)camTarget=null;}
  try{update(dm,dt);render(now);if(visit.p)renderRoom(now);}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}

const RIVER_CTRL=[[1292,175],[1272,280],[1250,380],[1228,470],[1160,555],[1138,650],[1142,770],[1182,858],[1262,935],[1332,968]];
function catmull(pts,seg){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;const f=j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);out.push([f(0),f(1)]);}}out.push(pts[pts.length-1].slice());return out;}
const RIVER=catmull(RIVER_CTRL,24);
const RIVER_LEN=[0];for(let i=1;i<RIVER.length;i++)RIVER_LEN.push(RIVER_LEN[i-1]+Math.hypot(RIVER[i][0]-RIVER[i-1][0],RIVER[i][1]-RIVER[i-1][1]));

function segInter(p,q,r,s){const d=(q[0]-p[0])*(s[1]-r[1])-(q[1]-p[1])*(s[0]-r[0]);if(Math.abs(d)<1e-9)return null;const t=((r[0]-p[0])*(s[1]-r[1])-(r[1]-p[1])*(s[0]-r[0]))/d,u=((r[0]-p[0])*(q[1]-p[1])-(r[1]-p[1])*(q[0]-p[0]))/d;return t>=0&&t<=1&&u>=0&&u<=1?[p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]:null;}
const BRIDGES=(()=>{const segs=EDGES.filter(isRoadEdge).map(([a,b])=>[N[a],N[b]]);segs.push([[780,890],[1290,890]]);const out=[];
  for(const [p,q] of segs){for(let i=1;i<RIVER.length;i++){const r=segInter(p,q,RIVER[i-1],RIVER[i]);if(r){out.push({x:r[0],y:r[1],ang:Math.atan2(q[1]-p[1],q[0]-p[0])});break;}}}return out;})();

function carveGrid(){
  if(CARVE)return CARVE;CARVE=new Float32Array(CGW*CGH);
  for(let i=0;i<RIVER.length-1;i++){const [ax,ay]=RIVER[i],[bx,by]=RIVER[i+1];const n=Math.ceil(Math.hypot(bx-ax,by-ay)/3);
    for(let k=0;k<=n;k++){const x=ax+(bx-ax)*k/n,y=ay+(by-ay)*k/n;
      for(let gy=Math.floor((y-20)/CG);gy<=Math.ceil((y+20)/CG);gy++)for(let gx=Math.floor((x-20)/CG);gx<=Math.ceil((x+20)/CG);gx++){
        if(gx<0||gy<0||gx>=CGW||gy>=CGH)continue;const d=Math.hypot(gx*CG-x,gy*CG-y);const v=d<10?1:d<18?1-(d-10)/8:0;const id=gy*CGW+gx;if(v>CARVE[id])CARVE[id]=v;}}}
  for(const b of BRIDGES){const ca=Math.cos(b.ang),sa=Math.sin(b.ang);
    for(let gy=Math.floor((b.y-24)/CG);gy<=Math.ceil((b.y+24)/CG);gy++)for(let gx=Math.floor((b.x-24)/CG);gx<=Math.ceil((b.x+24)/CG);gx++){
      if(gx<0||gy<0||gx>=CGW||gy>=CGH)continue;const dx=gx*CG-b.x,dy=gy*CG-b.y;if(Math.abs(-sa*dx+ca*dy)<10&&Math.abs(ca*dx+sa*dy)<22)CARVE[gy*CGW+gx]=0;}}
  return CARVE;
}
function carveAt(x,y){const g=carveGrid();return g[clamp(Math.round(y/CG),0,CGH-1)*CGW+clamp(Math.round(x/CG),0,CGW-1)];}

function stepTo(a,tx,ty,sp,dt){const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<.5)return true;const st=Math.min(d,sp*dt);a.x+=dx/d*st;a.y+=dy/d*st;a.face=Math.atan2(dx,dy);return d-st<.5;}
function tickNature(dtReal){
  const dt=speed===0?0:dtReal/1000*Math.min(speed,2);if(!dt)return;
  for(const f of FISH){
    if(f.w==='river'){f.s+=f.dir*f.sp*dt;if(f.s<20||f.s>RLEN-25||Math.random()<.002)f.dir*=-1;f.s=clamp(f.s,20,RLEN-25);
      const r=riverAt(f.s),l=Math.hypot(r.dx,r.dy)||1;f.x=r.x+(-r.dy/l)*f.off;f.y=r.y+(r.dx/l)*f.off;f.face=Math.atan2(r.dx*f.dir,r.dy*f.dir);f.h=0;}
    else{f.a+=f.sp*dt;const nx=f.cx+Math.cos(f.a)*f.r,ny=f.cy+Math.sin(f.a)*f.r*.6;f.face=Math.atan2(nx-f.x,ny-f.y);f.x=nx;f.y=ny;
      f.next-=dt;if(f.next<=0&&f.jump<=0){f.jump=1;f.next=rand(5,16);}
      if(f.jump>0){f.jump-=dt/.9;f.h=Math.sin(Math.PI*(1-Math.max(f.jump,0)))*1.4;}else f.h=0;}
  }
  for(const a of ANIM){
    if(a.k==='sheep'){
      const dm=Math.hypot(me.x-a.x,me.y-a.y);
      if(dm<34){const tx=a.x+(a.x-me.x)/dm*30,ty=a.y+(a.y-me.y)/dm*30;stepTo(a,clamp(tx,a.area[0],a.area[2]),clamp(ty,a.area[1],a.area[3]),26,dt);a.wait=rand(1,3);continue;}
      if(a.wait>0){a.wait-=dt;continue;}
      if(!a.tx){a.tx=rand(a.area[0],a.area[2]);a.ty=rand(a.area[1],a.area[3]);}
      if(stepTo(a,a.tx,a.ty,a.sp,dt)){a.tx=0;a.wait=rand(3,12);}
    }else if(a.k==='dog'&&a.yard){a.wag+=dt*10;if(a.wait>0){a.wait-=dt;continue;}if(stepTo(a,a.tx,a.ty,a.sp,dt)){a.tx=rand(a.yard[0],a.yard[2]);a.ty=rand(a.yard[1],a.yard[3]);a.wait=rand(2,8);}
    }else if(a.k==='swan'){a.a+=a.sp*dt;const nx=LAKE[0]+Math.cos(a.a)*LAKE[2]*a.r,ny=LAKE[1]+Math.sin(a.a)*LAKE[3]*a.r;a.face=Math.atan2(nx-a.x,ny-a.y);a.x=nx;a.y=ny;
    }else if(a.k==='dog'){
      const d=byId.diogenes;a.wag+=dt*14;
      if(!d.inside){const bx=d.x-12*(d.face||1),by=d.y+6;const far=Math.hypot(bx-a.x,by-a.y);stepTo(a,bx,by,far>30?70:28,dt);}
      else stepTo(a,650,690,30,dt);
    }else if(a.k==='pigeon'){
      if(a.fly>0){a.fly-=dt;a.h=Math.sin(Math.PI*clamp(1-a.fly/1.6,0,1))*3;stepTo(a,a.tx,a.ty,55,dt);if(a.fly<=0)a.h=0;continue;}
      const dm=Math.hypot(me.x-a.x,me.y-a.y);
      const pcx=a.cx||800,pcy=a.cy||470;if(dm<38){let tx=a.x+(a.x-me.x)/dm*70,ty=a.y+(a.y-me.y)/dm*70;const r=Math.hypot(tx-pcx,ty-pcy);if(r>85){tx=pcx+(tx-pcx)/r*85;ty=pcy+(ty-pcy)/r*85;}a.tx=tx;a.ty=ty;a.fly=1.6;continue;}
      a.wait-=dt;if(a.wait<=0){const an=rand(0,TAU);a.tx=clamp(a.x+Math.cos(an)*12,pcx-75,pcx+75);a.ty=clamp(a.y+Math.sin(an)*12,pcy-65,pcy+65);a.wait=rand(1,4);}
      if(a.tx)stepTo(a,a.tx,a.ty,14,dt);
    }else if(a.k==='cat'){
      if(a.wait>0){a.wait-=dt;continue;}
      if(stepTo(a,a.tx,a.ty,a.sp,dt)){a.tx=rand(a.area[0],a.area[2]);a.ty=rand(a.area[1],a.area[3]);a.wait=rand(6,20);}
    }else if(a.k==='gull'){
      a.a+=a.sp*dt;const nx=a.cx+Math.cos(a.a)*a.r,ny=a.cy+Math.sin(a.a)*a.r*.55;a.face=Math.atan2(nx-a.x,ny-a.y);a.x=nx;a.y=ny;
    }
  }
}

  {n:'起司罐',r:[390,310,220,120],d:'他寫信請朋友寄一小罐起司來，說：「這樣我想吃大餐的時候，就有大餐了。」簡單的快樂最可靠。',draw(c){R(c,380,370,240,16,'#8b6744');R(c,392,386,12,48,'#6f5236');R(c,596,386,12,48,'#6f5236');El(c,430,358,26,13,'#d7a65b','#a57a35',2);R(c,490,326,44,44,'#e8d9b0','#b9a77a',2);El(c,512,326,22,6,'#cdbb8a');R(c,560,340,22,30,'#9db6cf','#6f8aa8',2);}},

  {n:'油燈',r:[290,230,110,180],d:'夜深時，他在燈下檢討自己：今天哪裡做得不夠好？明天要怎麼做得更好？',draw(c,now){Li(c,[[345,260],[345,400]],'#5b4632',5);El(c,345,256,24,9,'#b88d4a','#7a5a2a',2);const f=Math.sin(now*.03)*2;El(c,366,244+f*.3,5,10+f,'#ffcf5a');const g=c.createRadialGradient(366,244,3,366,244,70);g.addColorStop(0,'rgba(255,210,110,.55)');g.addColorStop(1,'rgba(255,210,110,0)');c.fillStyle=g;c.fillRect(296,174,140,140);}},

  {n:'暖爐',r:[40,100,200,310],d:'1619 年冬天，他在德國多瑙河畔一間有暖爐的房間裡整天沉思，當晚做了三個夢，從此決心用一套方法重建所有知識。',draw(c){R(c,60,140,160,260,'#3c6e8f','#24506c',4);for(let y=160;y<400;y+=30)Li(c,[[60,y],[220,y]],'rgba(255,255,255,.5)',2);for(let x=100;x<220;x+=40)Li(c,[[x,140],[x,400]],'rgba(255,255,255,.5)',2);R(c,52,120,176,24,'#24506c');R(c,110,330,60,44,'#ff9a3c','#24506c',3);}},
  {n:'蠟塊',r:[270,320,140,110],d:'他拿一塊蜂蠟靠近火：顏色、氣味、形狀全變了，我們卻知道它還是同一塊蠟。可見真正認識事物的是心靈，不是感官。',draw(c,now){R(c,280,380,120,12,'#6f5236');R(c,330,392,20,40,'#6f5236');R(c,300,350,40,30,'#f0d27a','#c9a43f',2);R(c,356,340,10,40,'#f6efe0');El(c,361,334+Math.sin(now*.03),4,8,'#ffcf5a');}},
  {n:'帷幔床',r:[630,220,240,210],d:'他從小體弱，習慣躺在床上想到中午。晚年瑞典女王要他清晨五點講課，不到半年他就病逝了。',draw(c){R(c,640,240,12,190,'#5a3e2a');R(c,848,240,12,190,'#5a3e2a');R(c,640,232,220,16,'#7a2f2f');Po(c,[[652,248],[700,248],[680,380],[652,380]],'#8f3a3a');R(c,660,360,190,40,'#d9cfb3','#a89c7f',2);El(c,690,356,26,12,'#f2ede0');}},
  {n:'天花板上的蒼蠅',r:[400,6,160,90],d:'傳說他躺在床上看蒼蠅在天花板上爬，想到只要兩個數字就能標出牠的位置，直角座標由此而生。',draw(c,now){const x=470+Math.sin(now*.002)*30,y=45+Math.cos(now*.0031)*14;Li(c,[[x,y],[x,0]],'rgba(80,70,50,.45)',1.5,[4,4]);Li(c,[[x,y],[405,y]],'rgba(80,70,50,.45)',1.5,[4,4]);El(c,x,y,5,3.5,'#1d1a17');El(c,x-3,y-4,4,2,'rgba(200,220,240,.85)');El(c,x+3,y-4,4,2,'rgba(200,220,240,.85)');}}

  {n:'時鐘',r:[250,50,110,110],d:'鎮民據他散步的時間對錶。他的老僕人每天清晨五點前叫他起床，幾十年如一日。這面鐘走的就是小鎮的時間。',draw(c){Ci(c,305,105,46,'#f8f5ec','#5b4a30',5);for(let i=0;i<12;i++){const a=i/12*TAU;Li(c,[[305+Math.cos(a)*36,105+Math.sin(a)*36],[305+Math.cos(a)*42,105+Math.sin(a)*42]],'#5b4a30',3);}const mh=gameMin%60,hh=(gameMin/60)%12;Li(c,[[305,105],[305+Math.sin(hh/12*TAU)*22,105-Math.cos(hh/12*TAU)*22]],'#2b2418',5);Li(c,[[305,105],[305+Math.sin(mh/60*TAU)*34,105-Math.cos(mh/60*TAU)*34]],'#2b2418',3);}},
  {n:'窗外的塔樓',r:[610,50,240,260],d:'他沉思時習慣望著窗外的塔樓。後來鄰居的白楊樹長高擋住了視線，他還請鄰居把樹修短。',draw(c){R(c,620,60,220,240,'#bcd4e6','#f6f1e2',10);R(c,700,130,40,170,'#7a7f8a');Po(c,[[696,130],[744,130],[720,74]],'#5b6270');Ci(c,720,160,8,'#f6f1e2');El(c,800,250,16,46,'#4f7a45');Li(c,[[730,60],[730,300]],'#f6f1e2',6);Li(c,[[620,180],[840,180]],'#f6f1e2',6);}},

  {n:'蕾吉娜的信',r:[290,320,150,110],d:'他與蕾吉娜·奧爾森訂婚後，又主動退還戒指、解除婚約。這件事纏繞了他一輩子的寫作。',draw(c){R(c,300,380,140,12,'#4a3424');R(c,362,392,16,40,'#4a3424');R(c,318,356,62,26,'#f2ead6','#b9a77a',2);Li(c,[[318,356],[349,372],[380,356]],'#b9a77a',1.5);Ci(c,410,372,9,null,'#d9b25e',3);}},

  {n:'窗外的湖',r:[320,60,260,200],d:'1881 年夏天，他在西爾斯·瑪利亞附近的湖邊，經過一塊金字塔形的大石時，想到了「永恆回歸」。',draw(c){R(c,330,70,240,180,'#a9cde3','#5a3e26',10);Po(c,[[330,190],[400,110],[450,170],[510,100],[570,180],[570,200],[330,200]],'#8f9a96');Po(c,[[400,110],[386,128],[414,128]],'#fff');Po(c,[[510,100],[494,122],[526,122]],'#fff');R(c,335,200,230,45,'#4f86ad');Po(c,[[470,232],[484,206],[498,232]],'#a8a59c');Li(c,[[450,70],[450,250]],'#5a3e26',6);}},

/* ---------- multiplayer: browser-to-browser (PeerJS / WebRTC), host is authoritative ---------- */
const NET={role:'solo',peer:null,conns:new Map(),hostConn:null,myId:null,name:'',others:new Map(),chat:[],status:'',col:'#2f6db3'};

function netSend(conn,msg){try{if(conn&&conn.open)conn.send(msg);}catch(e){}}
function netBroadcast(msg,except){for(const c of NET.conns.values())if(c!==except)netSend(c,msg);}
function netToHost(msg){netSend(NET.hostConn,msg);}
function netEmit(msg){if(NET.role==='host')netBroadcast(msg);else if(NET.role==='guest')netToHost(msg);}

/* other players */
function upsertOther(st){
  let o=NET.others.get(st.id);
  if(!o){o={id:st.id,zh:st.name||'訪客',robe:st.col||'#c0392b',skin:'#f0cfae',seed:Math.random()*10,face:1,x:st.x,y:st.y,tx:st.x,ty:st.y,inside:false,say:null};NET.others.set(st.id,o);
    if(g3.ok){const sm=g3.marker;makeFigure(o);if(sm)g3.marker=sm;}renderPlayers();}
  o.zh=st.name||o.zh;o.tx=st.x;o.ty=st.y;o.inside=!!st.inside;o.lastSeen=performance.now();if(st.face)o.face=st.face;
  if(g3.figs[o.id])g3.figs[o.id].visible=!o.inside;return o;
}
function removeOther(id){const o=NET.others.get(id);if(!o)return;NET.others.delete(id);if(g3.figs[id]){g3.scene.remove(g3.figs[id]);delete g3.figs[id];}addChatLine('系統',`${o.zh} 離開了小鎮`);renderPlayers();}

/* NPC snapshots (host → guests) */
let netSlowT=0;
function hostSnapshot(full){
  const ppl=P.map(p=>full?[p.id,Math.round(p.x),Math.round(p.y),p.inside?1:0,p.face,p.act,p.thought,placeOf(p),p.talking?1:0]:[p.id,Math.round(p.x),Math.round(p.y),p.inside?1:0,p.face]);
  return {t:'snap',gm:gameMin,sp:speed,full:!!full,ppl};
}
function applySnapshot(m){
  gameMin=m.gm;if(speed!==m.sp){speed=m.sp;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.s===speed));}
  for(const r of m.ppl){const p=byId[r[0]];if(!p)continue;p.ntx=r[1];p.nty=r[2];if(p.nx==null){p.x=r[1];p.y=r[2];}p.nx=1;p.inside=!!r[3];p.face=r[4]||p.face;
    if(m.full){p.act=r[5];p.thought=r[6];p.netPlace=r[7];p.talking=!!r[8]||talk.p===p;}}
}
function guestUpdate(dt){
  for(const p of P){if(p.ntx==null)continue;const k=Math.min(1,dt/120);const d=Math.hypot(p.ntx-p.x,p.nty-p.y);p.netMoving=d>.4;if(d>200){p.x=p.ntx;p.y=p.nty;}else{p.x+=(p.ntx-p.x)*k;p.y+=(p.nty-p.y)*k;}}
}

/* debates mirrored on guests */
const netDeb=new Map();
function guestDebate(m){
  if(m.t==='deb'){if(netDeb.has(m.id))return;const d={id:m.id,a:byId[m.a],b:byId[m.b],theme:m.theme,place:m.place,time:m.time,lines:[],idx:-1,status:'talking',live:m.live};netDeb.set(m.id,d);d.a.debate=d;d.b.debate=d;debates.push(d);mountDebate(d);refreshDebateHead(d);(m.lines||[]).forEach(l=>guestDebate({t:'line',id:m.id,who:l[0],text:l[1]}));}
  else if(m.t==='line'){const d=netDeb.get(m.id);if(!d)return;const l={who:byId[m.who],text:m.text};d.lines.push(l);d.idx=d.lines.length-1;appendLine(d,l);}
  else if(m.t==='debEnd'){const d=netDeb.get(m.id);if(!d)return;d.status='done';if(d.a.debate===d)d.a.debate=null;if(d.b.debate===d)d.b.debate=null;const i=debates.indexOf(d);if(i>=0)debates.splice(i,1);d.el.classList.add('done');refreshDebateHead(d);netDeb.delete(m.id);}
}
function hostDebateMsg(d,kind,l){if(NET.role!=='host')return;
  if(kind==='deb')netBroadcast({t:'deb',id:d.id,a:d.a.id,b:d.b.id,theme:d.theme,place:d.place,time:d.time,live:d.live});
  else if(kind==='line')netBroadcast({t:'line',id:d.id,who:l.who.id,text:l.text});
  else netBroadcast({t:'debEnd',id:d.id});}

/* requests guests make of the host's world */
function hostHandleRequest(m){
  const p=byId[m.pid];
  if(m.t==='talk'&&p&&!p.inside&&!p.debate){const nn=p.path.find(q=>q.node);p.nextNode=nn?nn.node:p.nextNode;p.path=[];p.talking=true;p.netTalkers=(p.netTalkers||0)+1;}
  else if(m.t==='untalk'&&p){p.netTalkers=Math.max(0,(p.netTalkers||1)-1);if(!p.netTalkers&&talk.p!==p){p.talking=false;p.ekey=null;}}
  else if(m.t==='visit'&&p){p.netHosts=(p.netHosts||0)+1;p.host=true;p.ekey=null;}
  else if(m.t==='unvisit'&&p){p.netHosts=Math.max(0,(p.netHosts||1)-1);if(!p.netHosts&&visit.p!==p){p.host=null;p.ekey=null;}}
  else if(m.t==='summon'){const a=byId[m.a],b=byId[m.b];if(a&&b){for(const [x,y] of [[a,b],[b,a]]){x.summon={partner:y.id,theme:m.th,until:gameMin+240};x.ekey=null;}}}
}

function onChat(m,from){const o=NET.others.get(m.id);if(o)o.say={text:m.text,until:performance.now()+7000};addChatLine(m.name||'訪客',m.text,m.col);if(NET.role==='host')netBroadcast(m,from);}
function renderPlayers(){const ul=$('#netPlayers');if(!ul)return;ul.innerHTML='';const add=(name,col,tag)=>{const li=document.createElement('li');li.innerHTML=`<i class="dot" style="--c:${col}"></i>`;li.append(name+(tag?'（'+tag+'）':''));ul.append(li);};
  if(NET.role==='solo'){add(NET.name||'你',NET.col,'只有你');return;}add(NET.name||'你',NET.col,NET.role==='host'?'主持人・你':'你');for(const o of NET.others.values())add(o.zh,o.robe,o.isHost?'主持人':'');}

/* connection setup */
function hostStart(){
  NET.role='host';NET.myId='philotown-'+randCode();setNetStatus('正在建立小鎮……');
  NET.peer=new Peer(NET.myId);
  NET.peer.on('open',()=>{setNetStatus('小鎮已開放，把連結傳給朋友');$('#netLink').value=joinLink();$('#netShare').hidden=false;renderPlayers();});
  NET.peer.on('error',e=>{setNetStatus('連線出錯：'+(e.type||e.message||e));});
  NET.peer.on('connection',conn=>{
    conn.on('open',()=>{NET.conns.set(conn.peer,conn);});
    conn.on('data',m=>{
      if(m.t==='hello'){const col=PLAYER_COLS[NET.conns.size%PLAYER_COLS.length];conn.playerId=m.id;conn.col=col;
        netSend(conn,{t:'welcome',col,host:{id:NET.myId,name:NET.name,col:NET.col,x:me.x,y:me.y},players:[...NET.others.values()].map(o=>({id:o.id,name:o.zh,col:o.robe,x:o.x,y:o.y})),snap:hostSnapshot(true),
          debates:debates.map(d=>({t:'deb',id:d.id,a:d.a.id,b:d.b.id,theme:d.theme,place:d.place,time:d.time,live:d.live,lines:d.lines.slice(0,d.idx+1).map(l=>[l.who.id,l.text])})),chat:NET.chat.slice(-20)});
        const o=upsertOther({id:m.id,name:m.name,col,x:me.x,y:me.y});addChatLine('系統',`${o.zh} 加入了小鎮`);netBroadcast({t:'join',id:m.id,name:m.name,col},conn);}
      else if(m.t==='me'){upsertOther(m);netBroadcast(m,conn);}
      else if(m.t==='chat')onChat(m,conn);
      else hostHandleRequest(m);
    });
    conn.on('close',()=>{NET.conns.delete(conn.peer);if(conn.playerId){removeOther(conn.playerId);netBroadcast({t:'leave',id:conn.playerId});}});
  });
  setInterval(()=>{if(NET.role!=='host'||!NET.conns.size)return;netSlowT++;netBroadcast(hostSnapshot(netSlowT%10===0));},100);
}
function guestJoin(code){
  NET.role='guest';NET.myId='pl-'+randCode();setNetStatus('正在連線到朋友的小鎮……');
  NET.peer=new Peer(NET.myId);
  NET.peer.on('error',e=>{setNetStatus('連不上：'+(e.type==='peer-unavailable'?'找不到這個小鎮，主持人可能已經離開':(e.type||e.message||e)));});
  NET.peer.on('open',()=>{const conn=NET.peer.connect(code,{reliable:true});NET.hostConn=conn;
    conn.on('open',()=>{netSend(conn,{t:'hello',id:NET.myId,name:NET.name});});
    conn.on('data',m=>{
      if(m.t==='welcome'){NET.col=m.col;me.robe=m.col;if(g3.ok&&g3.figs.me){g3.scene.remove(g3.figs.me);const sm=g3.marker;makeFigure(me);}
        const h=upsertOther({id:m.host.id,name:m.host.name,col:m.host.col,x:m.host.x,y:m.host.y});h.isHost=true;for(const pl of m.players)if(pl.id!==NET.myId)upsertOther(pl);
        applySnapshot(m.snap);for(const d of m.debates)guestDebate(d);for(const c of m.chat)addChatLine(c.who,c.text,c.col);
        me.x=m.host.x+rand(-20,20);me.y=m.host.y+rand(10,30);setNetStatus('已加入小鎮');renderPlayers();addChatLine('系統','你加入了小鎮');
        $('#sp0').disabled=$('#sp1').disabled=$('#sp2').disabled=$('#sp4').disabled=true;}
      else if(m.t==='snap')applySnapshot(m);
      else if(m.t==='me'){if(m.id!==NET.myId)upsertOther(m);}
      else if(m.t==='join'){if(m.id!==NET.myId){upsertOther({id:m.id,name:m.name,col:m.col,x:me.x,y:me.y});addChatLine('系統',`${m.name} 加入了小鎮`);}}
      else if(m.t==='leave')removeOther(m.id);
      else if(m.t==='chat')onChat(m);
      else guestDebate(m);
    });
    conn.on('close',()=>{setNetStatus('主持人離線了，小鎮改由你自己繼續運作');NET.role='solo';for(const id of [...NET.others.keys()])removeOther(id);for(const d of [...debates]){d.status='done';d.a.debate=null;d.b.debate=null;}debates.length=0;for(const p of P){p.ntx=null;p.ekey=null;p.inside=false;p.lastNode=nearNode(p.x,p.y);p.L=null;p.arrived=false;}$('#sp0').disabled=$('#sp1').disabled=$('#sp2').disabled=$('#sp4').disabled=false;renderPlayers();});
  });
}
setInterval(()=>{if(NET.role==='solo')return;netEmit({t:'me',id:NET.myId,name:NET.name,col:NET.col,x:Math.round(me.x),y:Math.round(me.y),face:me.face,inside:!!visit.p});},100);

/* UI */
function netUI(){
  if(!netAvailable()){$('#tabNet').hidden=true;return;}
  let saved='';try{saved=localStorage.getItem('philotown-name')||'';}catch(e){}
  const m=location.hash.match(/join=([\w-]+)/),code=m?m[1]:null;
  $('#joinName').value=saved;$('#joinAsGuest').hidden=!code;$('#joinHostName').textContent=code?'朋友':'';
  $('#joinBox').hidden=false;$('#joinName').focus();
  const go=fn=>{const n=$('#joinName').value.trim().slice(0,16);if(!n){$('#joinMsg').textContent='先取個名字吧。';return;}NET.name=n;me.zh='你';try{localStorage.setItem('philotown-name',n);}catch(e){}$('#joinBox').hidden=true;$('#tabNet').hidden=false;fn();renderPlayers();};
  $('#joinAsGuest').onclick=()=>go(()=>guestJoin(code));
  $('#joinAsHost').onclick=()=>go(hostStart);
  $('#joinSolo').onclick=()=>go(()=>{NET.role='solo';setNetStatus('目前只有你一個人。想邀請朋友，按「建立小鎮並邀請朋友」。');$('#netHostBtn').hidden=false;});
  $('#netHostBtn').onclick=()=>{$('#netHostBtn').hidden=true;hostStart();};
  $('#netCopy').onclick=()=>{const v=$('#netLink').value;navigator.clipboard&&navigator.clipboard.writeText(v).then(()=>{$('#netCopy').textContent='已複製';setTimeout(()=>$('#netCopy').textContent='複製',1500);}).catch(()=>{$('#netLink').select();});};
  $('#netChatForm').onsubmit=e=>{e.preventDefault();const i=$('#netChatInput');sendPlayerChat(i.value);i.value='';};
}
// boot
P.forEach(placeInitial);
renderIntro();
g3.ok=init3D();if(!g3.ok)$('#viewBtn').hidden=true;
function note3D(){const n=$('#note3d');if(g3.ok||!g3.fail){n.hidden=true;return;}
  n.textContent=g3.fail==='webgl'?'這台裝置的瀏覽器沒有開啟 3D 繪圖（WebGL），所以先用 2D 地圖。Chrome 請到「設定 → 系統」打開「使用圖形加速功能」後重新整理；Safari 若開了「鎖定模式」也會關掉 3D。':g3.fail==='lib'?'3D 引擎沒有載入成功（可能被網路擋住），正在改用備用來源……':'3D 啟動失敗，先用 2D 地圖。（'+g3.fail+'）';
  const b=document.createElement('button');b.type='button';b.textContent='知道了';b.onclick=()=>{n.hidden=true;};n.append(b);n.hidden=false;}
function retry3D(){g3.fail=null;g3.ok=init3D();if(g3.ok){for(const o of NET.others.values())if(!g3.figs[o.id]){const sm=g3.marker;makeFigure(o);if(sm)g3.marker=sm;}$('#viewBtn').hidden=false;resize();setView3D(true);}note3D();}
if(!g3.ok&&g3.fail==='lib'){const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';sc.onload=retry3D;sc.onerror=()=>{g3.fail='3D 引擎無法從網路下載';note3D();};document.head.append(sc);}
setTimeout(note3D,0);
new ResizeObserver(()=>resize()).observe($('#mapwrap'));
resize();
setView3D(g3.ok);
if(document.fonts&&document.fonts.load){
  const sampleText=P.map(p=>p.zh+p.house.label).join('')+'廣場體育場哲學家小徑薛西弗斯之丘洞穴宗教倫理美感跳躍';
  Promise.all([document.fonts.load('700 11px "Noto Sans TC"',sampleText),document.fonts.load('600 9px "Noto Serif TC"','宗教倫理美感跳躍'),document.fonts.load('12px Marcellus','AGORA')]).then(()=>{buildStatic();repaintGround3D();}).catch(()=>{});
}
try{netUI();}catch(e){console.error(e);}
requestAnimationFrame(frame);
})();
</script>
